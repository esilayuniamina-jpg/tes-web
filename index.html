<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPE BENGOK - Autonomous Agent Voice Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tempe: { 700: '#b45309', 800: '#92400e', 900: '#78350f', dark: '#1c1208' },
                        agent: { 500: '#10b981', 600: '#059669' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tempe-dark text-amber-50 min-h-screen flex flex-col justify-between font-sans selection:bg-agent-500 selection:text-white">
    
    <!-- Header -->
    <header class="border-b border-amber-900/50 bg-tempe-dark/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-3xl">🫘</span> <span class="text-amber-400 tracking-wider">TEMPE BENGOK</span>
            </h1>
            <div class="flex items-center gap-2">
                <span class="text-xs px-3 py-1 bg-agent-500/20 text-agent-300 border border-agent-500/40 rounded-full font-mono shadow-sm flex items-center gap-1">
                    🛡️ Agent Direct Audio
                </span>
                <span id="audio-status-badge" class="text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm">
                    Ready
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-10 w-full flex-grow flex flex-col justify-center">
        <div class="bg-gradient-to-b from-tempe-900/60 to-tempe-800/80 border border-amber-600/30 rounded-2xl p-6 md:p-8 shadow-2xl space-y-5 backdrop-blur">
            
            <div class="text-center space-y-2">
                <div class="inline-block p-3 bg-gradient-to-tr from-amber-500/20 to-agent-500/20 rounded-2xl border border-amber-500/40 text-4xl mb-1 shadow-inner">
                    ⚡🔊
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-amber-200">Agent Voice Studio</h2>
                <p class="text-amber-100/70 text-sm max-w-md mx-auto">Sistem audio langsung tanpa hambatan dengan direct HTML5 streaming backend.</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="hidden text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-red-950/80 border border-red-500/50 text-red-300 shadow-inner"></div>

            <!-- Text Input -->
            <div class="space-y-1.5">
                <label for="text" class="block text-sm font-semibold text-amber-300">Teks Suara Tempe Bengok:</label>
                <textarea id="text" rows="3" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-4 text-amber-100 focus:ring-2 focus:ring-agent-500 focus:outline-none transition placeholder-amber-700/50 text-sm" placeholder="Ketik kalimat di sini...">Selamat datang di Tempe Bengok! Sistem audio agent langsung siap berbunyi tanpa kendala.</textarea>
            </div>

            <!-- Options Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label for="voice-lang" class="block text-xs font-semibold text-amber-300">Bahasa Suara:</label>
                    <select id="voice-lang" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-3 text-amber-100 text-xs focus:ring-2 focus:ring-agent-500 focus:outline-none">
                        <option value="id">🇮🇩 Bahasa Indonesia</option>
                        <option value="en">🇺🇸 English</option>
                        <option value="jv">🇮🇩 Bahasa Jawa</option>
                        <option value="su">🇮🇩 Bahasa Sunda</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label for="audio-mode" class="block text-xs font-semibold text-amber-300">Metode Audio:</label>
                    <select id="audio-mode" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-3 text-amber-100 text-xs focus:ring-2 focus:ring-agent-500 focus:outline-none">
                        <option value="direct">🚀 Direct HTML5 Stream (Paling Stabil)</option>
                        <option value="browser">🌐 Browser Speech API</option>
                    </select>
                </div>
            </div>

            <!-- Status Indicator -->
            <div id="status" class="text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-tempe-dark/60 border border-amber-900/50 text-amber-300 shadow-inner">
                Sistem Agent Siap. Klik tombol Play di bawah.
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-1">
                <button id="play-btn" class="flex-1 bg-gradient-to-r from-amber-500 via-agent-600 to-agent-500 hover:from-amber-400 hover:to-agent-400 text-white font-extrabold py-3.5 px-6 rounded-xl transition shadow-lg shadow-agent-500/20 flex items-center justify-center gap-2 cursor-pointer text-sm transform active:scale-95">
                    🔊 Play Suara Agent
                </button>
                <button id="stop-btn" class="bg-tempe-dark/90 hover:bg-tempe-dark text-amber-200 font-semibold py-3.5 px-5 rounded-xl transition border border-amber-700/70 flex items-center justify-center gap-2 cursor-pointer text-sm">
                    ⏹️ Stop
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-900/50 py-5 text-center text-amber-400/60 text-xs">
        <p>&copy; 2026 TEMPE BENGOK &bull; Agent Direct Audio Architecture.</p>
    </footer>

    <!-- Bulletproof Agent Audio Engine -->
    <script>
        const textInput = document.getElementById('text');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDiv = document.getElementById('status');
        const errorBanner = document.getElementById('error-banner');
        const badge = document.getElementById('audio-status-badge');
        const voiceLang = document.getElementById('voice-lang');
        const audioMode = document.getElementById('audio-mode');

        let currentStream = null;
        const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;

        function updateStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            if (isError) {
                errorBanner.textContent = msg;
                errorBanner.classList.remove('hidden');
                statusDiv.classList.add('hidden');
            } else {
                errorBanner.classList.add('hidden');
                statusDiv.classList.remove('hidden');
            }
        }

        playBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('Silakan masukkan teks terlebih dahulu!');
                return;
            }

            // Hentikan pemutaran sebelumnya
            stopEverything();

            const mode = audioMode.value;
            const lang = voiceLang.value;

            updateStatus('🚀 Agent sedang memproses audio...');
            playBtn.disabled = true;
            playBtn.classList.add('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Streaming...';
            badge.className = 'text-xs px-3 py-1 bg-agent-500/20 text-agent-300 border border-agent-500/40 rounded-full font-mono shadow-sm animate-pulse';

            if (mode === 'browser' && synth) {
                playBrowserSpeech(text, lang);
            } else {
                playDirectAudioStream(text, lang);
            }
        });

        function stopEverything() {
            if (currentStream) {
                currentStream.pause();
                currentStream = null;
            }
            if (synth) {
                try { synth.cancel(); } catch(e) {}
            }
        }

        function playDirectAudioStream(text, lang) {
            const encodedText = encodeURIComponent(text);
            // Menggunakan Google Translate TTS API endpoint yang sangat stabil untuk direct audio stream HTML5
            const streamUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=${lang}&client=tw-ob`;

            currentStream = new Audio();
            currentStream.src = streamUrl;
            currentStream.crossOrigin = "anonymous";

            currentStream.play().then(() => {
                updateStatus('🔊 Sedang memutar suara (Direct Stream)...');
            }).catch(err => {
                console.warn("Direct stream failed, trying browser fallback...", err);
                if (synth) {
                    playBrowserSpeech(text, lang);
                } else {
                    showError("Gagal memutar audio. Pastikan terhubung ke internet.");
                }
            });

            currentStream.onended = () => {
                resetAgentState();
            };

            currentStream.onerror = (e) => {
                console.error("Stream error:", e);
                if (synth) {
                    playBrowserSpeech(text, lang);
                } else {
                    showError("Error: Gagal memuat stream audio.");
                }
            };
        }

        function playBrowserSpeech(text, lang) {
            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang === 'id' ? 'id-ID' : (lang === 'en' ? 'en-US' : 'id-ID');
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                utterance.onstart = () => {
                    updateStatus('🔊 Sedang memutar (Browser Engine)...');
                };

                utterance.onend = () => {
                    resetAgentState();
                };

                utterance.onerror = (e) => {
                    showError("Gagal memutar suara di browser ini.");
                };

                synth.speak(utterance);
            } catch (err) {
                showError("Gagal memanggil engine suara.");
            }
        }

        function showError(msg) {
            updateStatus(msg, true);
            resetAgentState();
        }

        function resetAgentState() {
            playBtn.disabled = false;
            playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Ready';
            badge.className = 'text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm';
        }

        stopBtn.addEventListener('click', () => {
            stopEverything();
            resetAgentState();
            updateStatus('Pemutaran dihentikan.');
        });
    </script>
</body>
</html>
