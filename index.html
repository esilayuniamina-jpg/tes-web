<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPE BENGOK - Google TTS Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tempe: { 700: '#b45309', 800: '#92400e', 900: '#78350f', dark: '#1c1208' },
                        google: { blue: '#4285F4', red: '#EA4335', yellow: '#FBBC05', green: '#34A853' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tempe-dark text-amber-50 min-h-screen flex flex-col justify-between font-sans">
    
    <!-- Header -->
    <header class="border-b border-amber-900/50 bg-tempe-dark/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-3xl">🫘</span> <span class="text-amber-400 tracking-wider">TEMPE BENGOK</span>
            </h1>
            <span id="badge" class="text-xs px-3 py-1 bg-blue-500/20 text-blue-300 border border-blue-500/40 rounded-full font-mono shadow-sm">
                Google TTS Ready
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-10 w-full flex-grow flex flex-col justify-center">
        <div class="bg-gradient-to-b from-tempe-900/60 to-tempe-800/80 border border-amber-600/30 rounded-2xl p-6 md:p-8 shadow-2xl space-y-5">
            
            <div class="text-center space-y-2">
                <div class="inline-block p-3 bg-amber-500/20 rounded-2xl border border-amber-500/40 text-4xl mb-1">
                    🌐🎙️
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-amber-200">Google Cloud TTS Studio</h2>
                <p class="text-amber-100/70 text-sm max-w-md mx-auto">Memutar suara manusia natural menggunakan Google Text-to-Speech Engine.</p>
            </div>

            <!-- Text Input -->
            <div class="space-y-1.5">
                <label for="text" class="block text-sm font-semibold text-amber-300">Teks Suara Tempe Bengok:</label>
                <textarea id="text" rows="3" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-4 text-amber-100 focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm">Selamat datang di Tempe Bengok! Kuliner legendaris paling gurih dan nikmat.</textarea>
            </div>

            <!-- Status -->
            <div id="status" class="text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-tempe-dark/60 border border-amber-900/50 text-amber-300">
                Sistem siap memutar Google TTS.
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-1">
                <button id="play-btn" class="flex-1 bg-gradient-to-r from-blue-600 via-blue-500 to-green-500 hover:from-blue-500 hover:to-green-400 text-white font-extrabold py-3.5 px-6 rounded-xl transition shadow-lg flex items-center justify-center gap-2 cursor-pointer text-sm">
                    🔊 Putar Google TTS (Play)
                </button>
                <button id="stop-btn" class="bg-tempe-dark/90 hover:bg-tempe-dark text-amber-200 font-semibold py-3.5 px-5 rounded-xl transition border border-amber-700/70 flex items-center justify-center gap-2 cursor-pointer text-sm">
                    ⏹️ Stop
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-900/50 py-5 text-center text-amber-400/60 text-xs">
        <p>&copy; 2026 TEMPE BENGOK &bull; Powered by Google TTS Engine.</p>
    </footer>

    <!-- Google TTS & Web Speech Hybrid Dual Engine Script -->
    <script>
        const textInput = document.getElementById('text');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDiv = document.getElementById('status');
        const badge = document.getElementById('badge');

        let currentAudio = null;

        playBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert("Masukkan teks terlebih dahulu!");
                return;
            }

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }

            statusDiv.textContent = '🔊 Memuat Google TTS...';
            playBtn.disabled = true;
            playBtn.classList.add('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Streaming...';
            badge.className = 'text-xs px-3 py-1 bg-green-500/20 text-green-300 border border-green-500/40 rounded-full font-mono shadow-sm animate-pulse';

            // Metode 1: Google TTS Audio Stream via CORS proxy/direct endpoint
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob`;

            currentAudio = new Audio();
            currentAudio.src = url;

            currentAudio.play().then(() => {
                statusDiv.textContent = '🔊 Sedang memutar suara Google TTS...';
            }).catch(err => {
                console.warn("Audio stream blocked, switching to Native Speech Synthesis fallback...", err);
                tryNativeSpeech(text);
            });

            currentAudio.onended = () => {
                statusDiv.textContent = 'Pemutaran Google TTS selesai.';
                resetState();
            };

            currentAudio.onerror = () => {
                console.warn("Audio stream error, switching to Native Speech Synthesis fallback...");
                tryNativeSpeech(text);
            };
        });

        function tryNativeSpeech(text) {
            if (!('speechSynthesis' in window)) {
                statusDiv.textContent = 'Gagal: Browser tidak mendukung pemutaran suara.';
                resetState();
                return;
            }

            try {
                statusDiv.textContent = '🔊 Memutar via Browser Speech Engine...';
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const idVoice = voices.find(v => v.lang.includes('id') || v.lang.includes('ID'));
                if (idVoice) utterance.voice = idVoice;

                utterance.onend = () => {
                    statusDiv.textContent = 'Pemutaran selesai.';
                    resetState();
                };

                utterance.onerror = () => {
                    statusDiv.textContent = 'Gagal memutar suara. Periksa volume perangkat.';
                    resetState();
                };

                window.speechSynthesis.speak(utterance);
                if (window.speechSynthesis.paused) {
                    window.speechSynthesis.resume();
                }
            } catch (e) {
                statusDiv.textContent = 'Gagal total memutar suara: ' + e.message;
                resetState();
            }
        }

        stopBtn.addEventListener('click', () => {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            statusDiv.textContent = 'Pemutaran dihentikan.';
            resetState();
        });

        function resetState() {
            playBtn.disabled = false;
            playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Google TTS Ready';
            badge.className = 'text-xs px-3 py-1 bg-blue-500/20 text-blue-300 border border-blue-500/40 rounded-full font-mono shadow-sm';
        }
    </script>
</body>
</html>
