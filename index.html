<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPE BENGOK - Kuliner & Suara Khas Nusantara</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tempe: { 700: '#b45309', 800: '#92400e', 900: '#78350f', dark: '#1c1208' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tempe-dark text-amber-50 min-h-screen flex flex-col justify-between font-sans selection:bg-amber-500 selection:text-tempe-dark">
    
    <!-- Header -->
    <header class="border-b border-amber-900/50 bg-tempe-dark/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-3xl">🫘</span> <span class="text-amber-400 tracking-wider">TEMPE BENGOK</span>
            </h1>
            <span id="audio-status-badge" class="text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm">
                Audio Ready
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-12 w-full flex-grow flex flex-col justify-center">
        <div class="bg-gradient-to-b from-tempe-900/60 to-tempe-800/80 border border-amber-600/30 rounded-2xl p-6 md:p-10 shadow-2xl space-y-6 backdrop-blur">
            
            <div class="text-center space-y-3">
                <div class="inline-block p-3 bg-amber-500/20 rounded-2xl border border-amber-500/40 text-4xl mb-1 shadow-inner">
                    🎙️
                </div>
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight text-amber-200">TEMPE BENGOK</h2>
                <p class="text-amber-100/70 text-sm max-w-md mx-auto">Suarakan pesona kuliner legendaris Nusantara dengan teknologi Text-to-Speech interaktif.</p>
            </div>

            <!-- Error Banner (Hidden by default) -->
            <div id="error-banner" class="hidden text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-red-950/80 border border-red-500/50 text-red-300 shadow-inner"></div>

            <!-- Text Input -->
            <div class="space-y-2">
                <label for="text" class="block text-sm font-semibold text-amber-300">Teks Suara Tempe Bengok:</label>
                <textarea id="text" rows="4" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-4 text-amber-100 focus:ring-2 focus:ring-amber-500 focus:outline-none transition placeholder-amber-700/50" placeholder="Ketik kalimat tempe bengok di sini...">Selamat datang di Tempe Bengok! Rasakan gurih dan pedasnya kuliner legendaris yang bikin ketagihan.</textarea>
            </div>

            <!-- Status Indicator -->
            <div id="status" class="text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-tempe-dark/60 border border-amber-900/50 text-amber-300 shadow-inner">
                Sistem siap. Silakan klik tombol Play di bawah.
            </div>

            <!-- Buttons -->
            <div class="flex gap-4 pt-2">
                <button id="play-btn" class="flex-1 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-tempe-dark font-extrabold py-4 px-6 rounded-xl transition shadow-lg shadow-amber-600/30 flex items-center justify-center gap-2 cursor-pointer text-base transform active:scale-95">
                    🔊 Suarakan Tempe Bengok
                </button>
                <button id="stop-btn" class="bg-tempe-dark/90 hover:bg-tempe-dark text-amber-200 font-semibold py-4 px-6 rounded-xl transition border border-amber-700/70 flex items-center justify-center gap-2 cursor-pointer text-base">
                    ⏹️ Stop
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-900/50 py-6 text-center text-amber-400/60 text-sm">
        <p>&copy; 2026 TEMPE BENGOK Studio. All Rights Reserved.</p>
    </footer>

    <!-- Bulletproof Robust Logic -->
    <script>
        const textInput = document.getElementById('text');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDiv = document.getElementById('status');
        const errorBanner = document.getElementById('error-banner');
        const badge = document.getElementById('audio-status-badge');

        const synth = window.speechSynthesis;

        function updateStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            if (isError) {
                errorBanner.textContent = msg;
                errorBanner.classList.remove('hidden');
                statusDiv.classList.add('hidden');
            } else {
                errorBanner.classList.add('hidden');
                statusDiv.classList.remove('hidden');
            }
        }

        // Cek dukungan browser secara menyeluruh
        window.addEventListener('DOMContentLoaded', () => {
            if (!synth) {
                updateStatus('Peringatan: Browser Anda tidak mendukung Speech Synthesis API.', true);
                playBtn.disabled = true;
                playBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        let voices = [];
        function loadVoices() {
            if (!synth) return;
            try {
                voices = synth.getVoices();
            } catch (e) {
                console.error("Gagal memuat voices:", e);
            }
        }

        loadVoices();
        if (synth && synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = loadVoices;
        }

        playBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('Silakan masukkan teks terlebih dahulu!');
                return;
            }

            if (!synth) {
                alert('Browser Anda tidak mendukung fitur suara.');
                return;
            }

            // Tangani error jika synth sedang error atau macet
            try {
                synth.cancel();
                if (synth.paused) {
                    synth.resume();
                }
            } catch (err) {
                console.warn("Cancel/Resume warning:", err);
            }

            updateStatus('Memproses suara...');
            playBtn.disabled = true;
            playBtn.classList.add('opacity-50', 'cursor-not-allowed');

            let utterance;
            try {
                utterance = new SpeechSynthesisUtterance(text);
            } catch (err) {
                updateStatus('Gagal membuat objek suara: ' + err.message, true);
                playBtn.disabled = false;
                playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                return;
            }

            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            loadVoices();
            if (voices && voices.length > 0) {
                let selectedVoice = voices.find(v => v.lang === 'id-ID' || v.lang === 'id' || v.name.toLowerCase().includes('indonesia'));
                if (!selectedVoice) {
                    selectedVoice = voices.find(v => v.lang.startsWith('id')) || voices[0];
                }
                if (selectedVoice) {
                    utterance.voice = selectedVoice;
                }
            }

            utterance.onstart = () => {
                updateStatus('🔊 Sedang menyuarakan Tempe Bengok...');
                badge.textContent = 'Playing...';
                badge.className = 'text-xs px-3 py-1 bg-green-500/20 text-green-300 border border-green-500/40 rounded-full font-mono shadow-sm animate-pulse';
            };

            utterance.onend = () => {
                updateStatus('Pemutaran selesai.');
                playBtn.disabled = false;
                playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                badge.textContent = 'Audio Ready';
                badge.className = 'text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm';
            };

            utterance.onerror = (event) => {
                console.error('TTS Error event:', event);
                updateStatus('Terjadi kendala saat memutar suara. Mencoba ulang...', false);
                
                // Fallback attempt
                try {
                    const fallback = new SpeechSynthesisUtterance(text);
                    synth.speak(fallback);
                } catch (e) {
                    updateStatus('Gagal total memutar suara di browser ini.', true);
                }

                playBtn.disabled = false;
                playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                badge.textContent = 'Audio Ready';
                badge.className = 'text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm';
            };

            // Eksekusi pemutaran dengan pengaman catch
            try {
                synth.speak(utterance);

                // Watchdog untuk menghindari Chrome bug yang freeze di tengah jalan
                let timer = 0;
                const watchdog = setInterval(() => {
                    if (!synth.speaking) {
                        clearInterval(watchdog);
                        return;
                    }
                    timer += 250;
                    if (synth.paused) {
                        synth.resume();
                    }
                    if (timer > 15000) { // Max 15 detik timeout pengaman
                        clearInterval(watchdog);
                        synth.cancel();
                        playBtn.disabled = false;
                        playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        badge.textContent = 'Audio Ready';
                        badge.className = 'text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm';
                    }
                }, 250);

            } catch (err) {
                console.error('Speak invocation error:', err);
                updateStatus('Gagal memanggil engine suara: ' + err.message, true);
                playBtn.disabled = false;
                playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                badge.textContent = 'Audio Ready';
                badge.className = 'text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm';
            }
        });

        stopBtn.addEventListener('click', () => {
            if (synth) {
                try {
                    synth.cancel();
                } catch (e) {
                    console.error(e);
                }
            }
            updateStatus('Pemutaran dihentikan.');
            playBtn.disabled = false;
            playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Audio Ready';
            badge.className = 'text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm';
        });
    </script>
</body>
</html>
