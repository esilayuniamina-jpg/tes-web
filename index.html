<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indonesia - Instant Cloud Audio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#0f172a', 900: '#090d16' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-navy-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="font-bold text-xl flex items-center gap-2">
                ⚡ <span class="text-cyan-400">Igor Labs Cloud TTS</span>
            </div>
            <div class="text-sm text-cyan-400 font-mono">
                HTML5 Audio Stream
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="bg-navy-800 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
            <h1 class="text-2xl md:text-3xl font-extrabold mb-2 text-center">Text to Speech Bahasa Indonesia</h1>
            <p class="text-gray-400 text-center mb-8 text-sm">Menggunakan stream audio langsung dari server Google untuk kepastian suara 100% tanpa bergantung pada perangkat.</p>
            
            <div class="space-y-6">
                <!-- Textarea -->
                <div>
                    <label for="text-input" class="block text-sm font-semibold mb-2 text-cyan-400">Masukkan Teks:</label>
                    <textarea id="text-input" rows="5" class="w-full bg-navy-900 border border-gray-700 rounded-xl p-4 text-gray-100 focus:outline-none focus:border-cyan-400 transition" placeholder="Ketik teks di sini...">Halo! Selamat datang di aplikasi konversi teks ke suara bahasa Indonesia buatan Igor Labs.</textarea>
                </div>

                <!-- Status Info -->
                <div id="status-msg" class="text-xs text-center text-cyan-400 py-1">Sistem siap. Klik tombol Putar.</div>

                <!-- Audio Element -->
                <audio id="audio-player" class="hidden"></audio>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 pt-2">
                    <button id="speak-btn" class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-navy-900 font-bold py-3.5 px-6 rounded-xl transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 cursor-pointer">
                        🔊 Putar Suara (Play)
                    </button>
                    <button id="stop-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-3.5 px-6 rounded-xl transition border border-gray-700 flex items-center justify-center gap-2 cursor-pointer">
                        ⏹️ Berhenti (Stop)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 Igor Labs. Cloud Audio Engine.</p>
    </footer>

    <!-- JavaScript Audio Stream Handler -->
    <script>
        const textInput = document.getElementById('text-input');
        const speakBtn = document.getElementById('speak-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusMsg = document.getElementById('status-msg');
        const audioPlayer = document.getElementById('audio-player');

        speakBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('Silakan masukkan teks terlebih dahulu!');
                return;
            }

            statusMsg.textContent = "Menghubungkan ke server suara...";
            speakBtn.classList.add('opacity-50', 'cursor-not-allowed');

            // Hentikan audio sebelumnya
            audioPlayer.pause();
            audioPlayer.currentTime = 0;

            // Batasi teks maksimal 200 karakter per request
            const cleanText = text.substring(0, 200);
            
            // Menggunakan mirror proxy publik gstatic / translate_tts untuk menghindari masalah CORS di beberapa browser
            const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanText)}&tl=id&client=tw-ob`;

            audioPlayer.src = ttsUrl;
            
            audioPlayer.play().then(() => {
                statusMsg.textContent = "Sedang berbicara...";
            }).catch(error => {
                console.error("Audio play error:", error);
                statusMsg.textContent = "Gagal memutar. Ketuk layar atau klik 1 kali lagi untuk mengizinkan audio.";
                speakBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            });
        });

        audioPlayer.onended = () => {
            speakBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            statusMsg.textContent = "Pemutaran selesai.";
        };

        stopBtn.addEventListener('click', () => {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            speakBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            statusMsg.textContent = "Pemutaran dihentikan.";
        });
    </script>
</body>
</html>
