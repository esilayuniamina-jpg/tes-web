<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTS Indonesia - Interactive Audio Trigger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#0f172a', 900: '#090d16' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-navy-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="font-bold text-xl flex items-center gap-2">
                🛡️ <span class="text-cyan-400">Igor Labs Audio Security</span>
            </div>
            <div class="text-sm text-cyan-400 font-mono" id="engine-status">
                Autoplay Bypass Active
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="bg-navy-800 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
            <h1 class="text-2xl md:text-3xl font-extrabold mb-2 text-center">Text to Speech Bahasa Indonesia</h1>
            <p class="text-gray-400 text-center mb-8 text-sm">Menggunakan Web Speech API Murni (Tanpa CORS / Tanpa Blokir Browser).</p>
            
            <div class="space-y-6">
                <!-- Textarea -->
                <div>
                    <label for="text-input" class="block text-sm font-semibold mb-2 text-cyan-400">Masukkan Teks:</label>
                    <textarea id="text-input" rows="5" class="w-full bg-navy-900 border border-gray-700 rounded-xl p-4 text-gray-100 focus:outline-none focus:border-cyan-400 transition" placeholder="Ketik teks di sini...">Halo! Selamat datang di aplikasi konversi teks ke suara buatan Igor Labs.</textarea>
                </div>

                <!-- Status Info -->
                <div id="status-msg" class="text-xs text-center text-cyan-400 py-1">Sistem siap. Klik tombol untuk mengizinkan audio.</div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 pt-2">
                    <button id="speak-btn" class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-navy-900 font-bold py-3.5 px-6 rounded-xl transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2 cursor-pointer">
                        🔊 Putar Suara (Play)
                    </button>
                    <button id="stop-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-3.5 px-6 rounded-xl transition border border-gray-700 flex items-center justify-center gap-2 cursor-pointer">
                        ⏹️ Berhenti (Stop)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 Igor Labs. All rights reserved.</p>
    </footer>

    <!-- JavaScript Ultra Robust Handler -->
    <script>
        const textInput = document.getElementById('text-input');
        const speakBtn = document.getElementById('speak-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusMsg = document.getElementById('status-msg');

        let synth = window.speechSynthesis;

        // Inisialisasi awal untuk membuka kunci kebijakan autoplay browser
        window.addEventListener('click', () => {
            if (synth && synth.paused) {
                synth.resume();
            }
        }, { once: true });

        speakBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('Silakan masukkan teks terlebih dahulu!');
                return;
            }

            if (!synth) {
                alert('Browser Anda tidak mendukung Web Speech API.');
                return;
            }

            // Batalkan pemutaran sebelumnya untuk menghindari antrean macet
            synth.cancel();

            statusMsg.textContent = "Menyiapkan suara...";
            speakBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            // Ambil suara bahasa Indonesia
            const voices = synth.getVoices();
            const indonesianVoice = voices.find(v => v.lang.startsWith('id') || v.name.toLowerCase().includes('indonesia'));
            
            if (indonesianVoice) {
                utterance.voice = indonesianVoice;
            }

            utterance.onstart = () => {
                statusMsg.textContent = "Sedang berbicara...";
            };

            utterance.onend = () => {
                speakBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                statusMsg.textContent = "Pemutaran selesai.";
            };

            utterance.onerror = (e) => {
                console.error("SpeechSynthesis error:", e);
                speakBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                statusMsg.textContent = "Error: Pastikan browser mengizinkan audio untuk situs ini.";
            };

            // Jalankan dengan sedikit delay agar engine stabil
            setTimeout(() => {
                synth.speak(utterance);
                if (synth.paused) {
                    synth.resume();
                }
            }, 50);
        });

        stopBtn.addEventListener('click', () => {
            if (synth) {
                synth.cancel();
            }
            speakBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            statusMsg.textContent = "Pemutaran dihentikan.";
        });
    </script>
</body>
</html>
