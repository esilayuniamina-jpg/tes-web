<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPE BENGOK - Web Audio Speech Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tempe: { 700: '#b45309', 800: '#92400e', 900: '#78350f', dark: '#1c1208' },
                        synth: { 500: '#10b981', 600: '#059669' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tempe-dark text-amber-50 min-h-screen flex flex-col justify-between font-sans">
    
    <!-- Header -->
    <header class="border-b border-amber-900/50 bg-tempe-dark/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-3xl">🫘</span> <span class="text-amber-400 tracking-wider">TEMPE BENGOK</span>
            </h1>
            <span id="badge" class="text-xs px-3 py-1 bg-synth-500/20 text-synth-300 border border-synth-500/40 rounded-full font-mono shadow-sm">
                Ready
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-10 w-full flex-grow flex flex-col justify-center">
        <div class="bg-gradient-to-b from-tempe-900/60 to-tempe-800/80 border border-amber-600/30 rounded-2xl p-6 md:p-8 shadow-2xl space-y-5">
            
            <div class="text-center space-y-2">
                <div class="inline-block p-3 bg-amber-500/20 rounded-2xl border border-amber-500/40 text-4xl mb-1">
                    🎵🔊
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-amber-200">Audio Speech Generator</h2>
                <p class="text-amber-100/70 text-sm max-w-md mx-auto">Solusi pasti berbunyi: Mengubah teks menjadi nada suara sintetis (Speech Beep/Melody) menggunakan Web Audio API.</p>
            </div>

            <!-- Text Input -->
            <div class="space-y-1.5">
                <label for="text" class="block text-sm font-semibold text-amber-300">Teks Suara Tempe Bengok:</label>
                <textarea id="text" rows="3" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-4 text-amber-100 focus:ring-2 focus:ring-synth-500 focus:outline-none transition text-sm">Tempe Bengok mantap!</textarea>
            </div>

            <!-- Status -->
            <div id="status" class="text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-tempe-dark/60 border border-amber-900/50 text-amber-300">
                Sistem siap memutar suara.
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-1">
                <button id="play-btn" class="flex-1 bg-gradient-to-r from-amber-500 to-synth-600 hover:from-amber-400 hover:to-synth-500 text-white font-extrabold py-3.5 px-6 rounded-xl transition shadow-lg flex items-center justify-center gap-2 cursor-pointer text-sm">
                    🔊 Putar Suara Sintetis (Play)
                </button>
                <button id="stop-btn" class="bg-tempe-dark/90 hover:bg-tempe-dark text-amber-200 font-semibold py-3.5 px-5 rounded-xl transition border border-amber-700/70 flex items-center justify-center gap-2 cursor-pointer text-sm">
                    ⏹️ Stop
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-900/50 py-5 text-center text-amber-400/60 text-xs">
        <p>&copy; 2026 TEMPE BENGOK &bull; Web Audio API Synthesizer.</p>
    </footer>

    <!-- Analisis & Solusi Pemutaran Berbasis Web Audio Oscillator Melody -->
    <script>
        const textInput = document.getElementById('text');
        const playBtn = document.getElementById('play-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDiv = document.getElementById('status');
        const badge = document.getElementById('badge');

        let audioCtx = null;
        let isPlaying = false;
        let currentTimers = [];

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // Fungsi mengubah karakter teks menjadi rangkaian frekuensi nada (Melodi Tempe Bengok)
        playBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('Masukkan teks terlebih dahulu!');
                return;
            }

            stopAll();
            isPlaying = true;
            playBtn.disabled = true;
            playBtn.classList.add('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Playing...';
            badge.className = 'text-xs px-3 py-1 bg-green-500/20 text-green-300 border border-green-500/40 rounded-full font-mono shadow-sm animate-pulse';
            statusDiv.textContent = '🔊 Memainkan melodi suara dari teks...';

            const ctx = getAudioContext();
            
            // Konversi setiap huruf ke kode ASCII untuk menentukan tinggi nada (frekuensi)
            const chars = text.split('');
            let delay = 0;
            const noteDuration = 0.15; // durasi per huruf (detik)

            chars.forEach((char, index) => {
                const code = char.charCodeAt(0);
                // Petakan kode ASCII ke rentang frekuensi nada musik (200Hz - 1200Hz)
                const freq = 200 + (code % 1000) * 1.2;

                const timer = setTimeout(() => {
                    if (!isPlaying) return;

                    try {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();

                        // Gunakan tipe gelombang 'triangle' atau 'sine' agar merdu di telinga
                        osc.type = char === ' ' ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(freq, ctx.currentTime);

                        gain.gain.setValueAtTime(0.3, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + noteDuration);

                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        osc.start();
                        osc.stop(ctx.currentTime + noteDuration);
                    } catch (e) {
                        console.error(e);
                    }

                    if (index === chars.length - 1) {
                        setTimeout(() => {
                            resetState();
                            statusDiv.textContent = 'Pemutaran melodi selesai.';
                        }, noteDuration * 1000);
                    }
                }, delay);

                currentTimers.push(timer);
                delay += noteDuration * 1000;
            });
        });

        function stopAll() {
            isPlaying = false;
            currentTimers.forEach(t => clearTimeout(t));
            currentTimers = [];
            resetState();
        }

        function resetState() {
            playBtn.disabled = false;
            playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Ready';
            badge.className = 'text-xs px-3 py-1 bg-synth-500/20 text-synth-300 border border-synth-500/40 rounded-full font-mono shadow-sm';
        }

        stopBtn.addEventListener('click', () => {
            stopAll();
            statusDiv.textContent = 'Pemutaran dihentikan.';
        });
    </script>
</body>
</html>
