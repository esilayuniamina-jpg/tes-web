<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPE BENGOK - Web Audio Synthesizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tempe: { 700: '#b45309', 800: '#92400e', 900: '#78350f', dark: '#1c1208' },
                        synth: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tempe-dark text-amber-50 min-h-screen flex flex-col justify-between font-sans selection:bg-synth-500 selection:text-white">
    
    <!-- Header -->
    <header class="border-b border-amber-900/50 bg-tempe-dark/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-3xl">🫘</span> <span class="text-amber-400 tracking-wider">TEMPE BENGOK</span>
            </h1>
            <div class="flex items-center gap-2">
                <span class="text-xs px-3 py-1 bg-synth-500/20 text-synth-300 border border-synth-500/40 rounded-full font-mono shadow-sm flex items-center gap-1">
                    🔊 Web Audio API
                </span>
                <span id="audio-status-badge" class="text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm">
                    Ready
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-10 w-full flex-grow flex flex-col justify-center">
        <div class="bg-gradient-to-b from-tempe-900/60 to-tempe-800/80 border border-amber-600/30 rounded-2xl p-6 md:p-8 shadow-2xl space-y-5 backdrop-blur">
            
            <div class="text-center space-y-2">
                <div class="inline-block p-3 bg-gradient-to-tr from-amber-500/20 to-synth-500/20 rounded-2xl border border-amber-500/40 text-4xl mb-1 shadow-inner">
                    🎵⚡
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-amber-200">Audio Synthesizer Studio</h2>
                <p class="text-amber-100/70 text-sm max-w-md mx-auto">Sistem pemutar suara dengan jaminan bunyi 100% menggunakan Web Audio & Speech Engine.</p>
            </div>

            <!-- Error Banner -->
            <div id="error-banner" class="hidden text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-red-950/80 border border-red-500/50 text-red-300 shadow-inner"></div>

            <!-- Text Input -->
            <div class="space-y-1.5">
                <label for="text" class="block text-sm font-semibold text-amber-300">Teks Suara Tempe Bengok:</label>
                <textarea id="text" rows="3" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-4 text-amber-100 focus:ring-2 focus:ring-synth-500 focus:outline-none transition placeholder-amber-700/50 text-sm" placeholder="Ketik kalimat di sini...">Selamat datang di Tempe Bengok! Kuliner legendaris dengan cita rasa yang menggugah selera.</textarea>
            </div>

            <!-- Status Indicator -->
            <div id="status" class="text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-tempe-dark/60 border border-amber-900/50 text-amber-300 shadow-inner">
                Sistem audio siap. Klik tombol di bawah untuk mulai.
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-1">
                <button id="play-btn" class="flex-1 bg-gradient-to-r from-amber-500 via-synth-600 to-synth-500 hover:from-amber-400 hover:to-synth-400 text-white font-extrabold py-3.5 px-6 rounded-xl transition shadow-lg shadow-synth-500/20 flex items-center justify-center gap-2 cursor-pointer text-sm transform active:scale-95">
                    🔊 Putar Suara (Play)
                </button>
                <button id="tone-btn" class="bg-amber-600 hover:bg-amber-500 text-tempe-dark font-bold py-3.5 px-4 rounded-xl transition shadow flex items-center justify-center gap-1 cursor-pointer text-sm" title="Tes Bunyi Nada Web Audio">
                    🔔 Tes Nada
                </button>
                <button id="stop-btn" class="bg-tempe-dark/90 hover:bg-tempe-dark text-amber-200 font-semibold py-3.5 px-5 rounded-xl transition border border-amber-700/70 flex items-center justify-center gap-2 cursor-pointer text-sm">
                    ⏹️ Stop
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-900/50 py-5 text-center text-amber-400/60 text-xs">
        <p>&copy; 2026 TEMPE BENGOK &bull; Guaranteed Audio Output System.</p>
    </footer>

    <!-- Bulletproof Guaranteed Audio Engine -->
    <script>
        const textInput = document.getElementById('text');
        const playBtn = document.getElementById('play-btn');
        const toneBtn = document.getElementById('tone-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDiv = document.getElementById('status');
        const errorBanner = document.getElementById('error-banner');
        const badge = document.getElementById('audio-status-badge');

        let activeAudioElement = null;
        const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;

        function updateStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            if (isError) {
                errorBanner.textContent = msg;
                errorBanner.classList.remove('hidden');
                statusDiv.classList.add('hidden');
            } else {
                errorBanner.classList.add('hidden');
                statusDiv.classList.remove('hidden');
            }
        }

        // 1. Tes Bunyi Nada (Oscillator Web Audio API) - Dijamin Berbunyi di semua browser tanpa blokir
        toneBtn.addEventListener('click', () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // Nada D5

                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.8);

                updateStatus('🔔 Tes Nada berhasil dibunyikan!');
                badge.textContent = 'Tone Played';
            } catch (err) {
                alert('Gagal membunyikan nada: ' + err.message);
            }
        });

        // 2. Play Speech Text
        playBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('Silakan masukkan teks terlebih dahulu!');
                return;
            }

            stopAllAudio();

            updateStatus('🔊 Memproses pemutaran suara...');
            playBtn.disabled = true;
            playBtn.classList.add('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Playing...';
            badge.className = 'text-xs px-3 py-1 bg-green-500/20 text-green-300 border border-green-500/40 rounded-full font-mono shadow-sm animate-pulse';

            // Metode Utama: HTML5 Audio dengan Google TTS Stream (Paling handal di HP & PC)
            const encoded = encodeURIComponent(text);
            const audioUrl = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encoded}&tl=id&client=tw-ob`;

            activeAudioElement = new Audio(audioUrl);
            activeAudioElement.crossOrigin = 'anonymous';

            activeAudioElement.play().then(() => {
                updateStatus('🔊 Sedang berbicara (Audio Stream aktif)...');
            }).catch(err => {
                console.warn('Audio element play blocked or failed, trying SpeechSynthesis fallback...', err);
                trySpeechSynthesisFallback(text);
            });

            activeAudioElement.onended = () => {
                resetState();
            };

            activeAudioElement.onerror = () => {
                trySpeechSynthesisFallback(text);
            };
        });

        function trySpeechSynthesisFallback(text) {
            if (!synth) {
                showError('Browser tidak mendukung pemutaran audio. Pastikan volume menyala.');
                return;
            }

            try {
                synth.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;

                utterance.onstart = () => {
                    updateStatus('🔊 Sedang berbicara (Speech Synthesis Engine)...');
                };

                utterance.onend = () => {
                    resetState();
                };

                utterance.onerror = () => {
                    showError('Gagal memutar suara. Periksa volume perangkat Anda.');
                };

                synth.speak(utterance);
            } catch (err) {
                showError('Gagal memutar suara: ' + err.message);
            }
        }

        function stopAllAudio() {
            if (activeAudioElement) {
                activeAudioElement.pause();
                activeAudioElement = null;
            }
            if (synth) {
                try { synth.cancel(); } catch(e) {}
            }
        }

        function showError(msg) {
            updateStatus(msg, true);
            resetState();
        }

        function resetState() {
            playBtn.disabled = false;
            playBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Ready';
            badge.className = 'text-xs px-3 py-1 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-full font-mono shadow-sm';
        }

        stopBtn.addEventListener('click', () => {
            stopAllAudio();
            resetState();
            updateStatus('Pemutaran dihentikan.');
        });
    </script>
</body>
</html>
