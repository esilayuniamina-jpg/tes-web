<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech Gratis - Google TTS & Web Speech API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#0f172a', 900: '#090d16' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-gray-100 font-sans min-h-screen flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-navy-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="font-bold text-xl flex items-center gap-2">
                🗣️ <span class="text-cyan-400">Free TTS Studio</span>
            </div>
            <div class="text-sm text-gray-400">
                Powered by Web Speech API
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="bg-navy-800 border border-gray-800 rounded-2xl p-6 md:p-8 shadow-2xl">
            <h1 class="text-2xl md:text-3xl font-extrabold mb-2 text-center">Text to Speech Gratis</h1>
            <p class="text-gray-400 text-center mb-8 text-sm">Ketik teks apa saja dan ubah langsung menjadi suara menggunakan sintesis suara browser / Google Speech.</p>
            
            <div class="space-y-6">
                <!-- Textarea -->
                <div>
                    <label for="text-input" class="block text-sm font-semibold mb-2 text-cyan-400">Masukkan Teks:</label>
                    <textarea id="text-input" rows="5" class="w-full bg-navy-900 border border-gray-700 rounded-xl p-4 text-gray-100 focus:outline-none focus:border-cyan-400 transition" placeholder="Halo! Selamat datang di aplikasi konversi teks ke suara gratis...">Halo! Selamat datang di aplikasi konversi teks ke suara gratis. Anda bisa mengetik kalimat apa saja di sini dan mendengarkannya secara instan!</textarea>
                </div>

                <!-- Controls Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Voice Selection -->
                    <div>
                        <label for="voice-select" class="block text-sm font-semibold mb-2 text-cyan-400">Pilih Suara / Bahasa:</label>
                        <select id="voice-select" class="w-full bg-navy-900 border border-gray-700 rounded-xl p-3 text-gray-100 focus:outline-none focus:border-cyan-400 transition"></select>
                    </div>

                    <!-- Speed Control -->
                    <div>
                        <label for="rate-range" class="block text-sm font-semibold mb-2 text-cyan-400">Kecepatan Suara: <span id="rate-val">1.0</span>x</label>
                        <input type="range" id="rate-range" min="0.5" max="2" value="1" step="0.1" class="w-full accent-cyan-400 mt-3">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 pt-4">
                    <button id="speak-btn" class="flex-1 bg-cyan-500 hover:bg-cyan-600 text-navy-900 font-bold py-3.5 px-6 rounded-xl transition shadow-lg shadow-cyan-500/20 flex items-center justify-center gap-2">
                        🔊 Ucapkan (Play)
                    </button>
                    <button id="stop-btn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 font-semibold py-3.5 px-6 rounded-xl transition border border-gray-700 flex items-center justify-center gap-2">
                        ⏹️ Berhenti (Stop)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800 py-6 text-center text-gray-500 text-sm">
        <p>&copy; 2026 Free TTS Studio. Menggunakan Web Speech Synthesis API.</p>
    </footer>

    <!-- JavaScript TTS -->
    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const rateRange = document.getElementById('rate-range');
        const rateVal = document.getElementById('rate-val');
        const speakBtn = document.getElementById('speak-btn');
        const stopBtn = document.getElementById('stop-btn');

        let voices = [];

        function populateVoiceList() {
            voices = synth.getVoices().sort((a, b) => {
                const an = a.name.toLowerCase();
                const bn = b.name.toLowerCase();
                if (an.includes('indonesia') || an.includes('id-id')) return -1;
                if (bn.includes('indonesia') || bn.includes('id-id')) return 1;
                return an.localeCompare(bn);
            });
            
            voiceSelect.innerHTML = '';
            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.value = i;
                option.textContent = `${voice.name} (${voice.lang})${voice.default ? ' — DEFAULT' : ''}`;
                
                if (voice.lang.includes('id') || voice.lang.includes('ID') || voice.name.toLowerCase().includes('indonesia')) {
                    option.selected = true;
                }
                voiceSelect.appendChild(option);
            });
        }

        populateVoiceList();
        if (synth.onvoiceschanged !== undefined) {
            synth.onvoiceschanged = populateVoiceList;
        }

        rateRange.addEventListener('input', () => {
            rateVal.textContent = rateRange.value;
        });

        speakBtn.addEventListener('click', () => {
            if (synth.speaking) {
                synth.cancel();
            }
            if (textInput.value !== '') {
                const utterThis = new SpeechSynthesisUtterance(textInput.value);
                const selectedOption = voiceSelect.selectedOptions[0];
                if (selectedOption) {
                    utterThis.voice = voices[selectedOption.value];
                }
                utterThis.rate = parseFloat(rateRange.value);
                
                utterThis.onend = () => {
                    speakBtn.classList.remove('opacity-50');
                };
                
                speakBtn.classList.add('opacity-50');
                synth.speak(utterThis);
            }
        });

        stopBtn.addEventListener('click', () => {
            synth.cancel();
            speakBtn.classList.remove('opacity-50');
        });
    </script>
</body>
</html>
