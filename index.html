<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPE BENGOK - Google AI Studio Integration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tempe: { 700: '#b45309', 800: '#92400e', 900: '#78350f', dark: '#1c1208' },
                        gemini: { 500: '#8b5cf6', 600: '#7c3aed' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-tempe-dark text-amber-50 min-h-screen flex flex-col justify-between font-sans">
    
    <!-- Header -->
    <header class="border-b border-amber-900/50 bg-tempe-dark/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="text-3xl">🫘</span> <span class="text-amber-400 tracking-wider">TEMPE BENGOK</span>
            </h1>
            <span id="badge" class="text-xs px-3 py-1 bg-gemini-500/20 text-gemini-300 border border-gemini-500/40 rounded-full font-mono shadow-sm">
                AI Studio Connected
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-6 py-10 w-full flex-grow flex flex-col justify-center space-y-6">
        <div class="bg-gradient-to-b from-tempe-900/60 to-tempe-800/80 border border-amber-600/30 rounded-2xl p-6 md:p-8 shadow-2xl space-y-5">
            
            <div class="text-center space-y-2">
                <div class="inline-block p-3 bg-gemini-500/20 rounded-2xl border border-gemini-500/40 text-4xl mb-1">
                    ✨🤖
                </div>
                <h2 class="text-2xl md:text-3xl font-extrabold tracking-tight text-amber-200">Google AI Studio Assistant</h2>
                <p class="text-amber-100/70 text-sm max-w-md mx-auto">Tanya apa saja tentang Tempe Bengok, AI akan merespons teks dan menyuarakannya secara otomatis.</p>
            </div>

            <!-- API Key Input -->
            <div class="space-y-1.5">
                <label for="api-key" class="block text-xs font-semibold text-amber-300">Google AI Studio API Key (Gemini):</label>
                <input type="password" id="api-key" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl px-4 py-2.5 text-amber-100 focus:ring-2 focus:ring-gemini-500 focus:outline-none transition text-xs font-mono" placeholder="Masukkan Gemini API Key Anda di sini...">
            </div>

            <!-- Prompt Input -->
            <div class="space-y-1.5">
                <label for="prompt" class="block text-sm font-semibold text-amber-300">Pertanyaan / Perintah untuk AI:</label>
                <textarea id="prompt" rows="3" class="w-full bg-tempe-dark/80 border border-amber-700/60 rounded-xl p-4 text-amber-100 focus:ring-2 focus:ring-gemini-500 focus:outline-none transition text-sm" placeholder="Contoh: Buatkan pantun tentang kelezatan Tempe Bengok!">Ceritakan kelezatan Tempe Bengok dalam satu kalimat yang menggugah selera.</textarea>
            </div>

            <!-- AI Response Box -->
            <div id="response-box" class="hidden space-y-1.5">
                <label class="block text-xs font-semibold text-gemini-400">Respon Gemini AI:</label>
                <div id="ai-output" class="p-4 rounded-xl bg-tempe-dark/90 border border-gemini-500/40 text-amber-100 text-sm font-mono"></div>
            </div>

            <!-- Status -->
            <div id="status" class="text-xs text-center font-mono py-2.5 px-4 rounded-xl bg-tempe-dark/60 border border-amber-900/50 text-amber-300">
                Sistem AI Studio siap digunakan.
            </div>

            <!-- Buttons -->
            <div class="flex gap-3 pt-1">
                <button id="ask-btn" class="flex-1 bg-gradient-to-r from-amber-500 via-gemini-600 to-gemini-500 hover:from-amber-400 hover:to-gemini-400 text-white font-extrabold py-3.5 px-6 rounded-xl transition shadow-lg flex items-center justify-center gap-2 cursor-pointer text-sm">
                    ✨ Tanya AI & Suarakan
                </button>
                <button id="stop-btn" class="bg-tempe-dark/90 hover:bg-tempe-dark text-amber-200 font-semibold py-3.5 px-5 rounded-xl transition border border-amber-700/70 flex items-center justify-center gap-2 cursor-pointer text-sm">
                    ⏹️ Stop
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-900/50 py-5 text-center text-amber-400/60 text-xs">
        <p>&copy; 2026 TEMPE BENGOK &bull; Powered by Google AI Studio (Gemini API).</p>
    </footer>

    <!-- Google AI Studio & TTS Integration Script -->
    <script>
        const apiKeyInput = document.getElementById('api-key');
        const promptInput = document.getElementById('prompt');
        const askBtn = document.getElementById('ask-btn');
        const stopBtn = document.getElementById('stop-btn');
        const statusDiv = document.getElementById('status');
        const responseBox = document.getElementById('response-box');
        const aiOutput = document.getElementById('ai-output');
        const badge = document.getElementById('badge');

        let currentAudio = null;

        askBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const prompt = promptInput.value.trim();

            if (!apiKey) {
                alert("Masukkan Google AI Studio API Key terlebih dahulu!");
                apiKeyInput.focus();
                return;
            }
            if (!prompt) {
                alert("Masukkan pertanyaan atau perintah untuk AI!");
                promptInput.focus();
                return;
            }

            stopAll();

            statusDiv.textContent = '✨ Menghubungkan ke Gemini AI Studio...';
            askBtn.disabled = true;
            askBtn.classList.add('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'Thinking...';
            badge.className = 'text-xs px-3 py-1 bg-gemini-500/20 text-gemini-300 border border-gemini-500/40 rounded-full font-mono shadow-sm animate-pulse';

            try {
                // Panggil Gemini API (gemini-1.5-flash)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Jawab dalam bahasa Indonesia secara singkat, ramah, dan siap disuarakan: " + prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const replyText = data.candidates[0].content.parts[0].text.trim();
                
                aiOutput.textContent = replyText;
                responseBox.classList.remove('hidden');

                statusDiv.textContent = '🔊 Mensintesis suara dari jawaban AI...';
                badge.textContent = 'Speaking...';

                speakText(replyText);

            } catch (err) {
                console.error(err);
                statusDiv.textContent = 'Error: ' + err.message;
                resetState();
            }
        });

        function speakText(text) {
            // Gunakan Google TTS stream untuk membaca jawaban AI
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=id&client=tw-ob`;

            currentAudio = new Audio(url);
            currentAudio.crossOrigin = "anonymous";

            currentAudio.play().then(() => {
                statusDiv.textContent = '🔊 Sedang membacakan jawaban Gemini AI...';
            }).catch(err => {
                console.warn("Audio stream blocked, falling back to browser speech...");
                fallbackBrowserSpeech(text);
            });

            currentAudio.onended = () => {
                statusDiv.textContent = 'Selesai menyampaikan respon AI.';
                resetState();
            };

            currentAudio.onerror = () => {
                fallbackBrowserSpeech(text);
            };
        }

        function fallbackBrowserSpeech(text) {
            if (!('speechSynthesis' in window)) {
                statusDiv.textContent = 'Gagal memutar audio.';
                resetState();
                return;
            }

            try {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 1.0;
                
                utterance.onend = () => {
                    statusDiv.textContent = 'Selesai menyampaikan respon AI.';
                    resetState();
                };

                utterance.onerror = () => {
                    statusDiv.textContent = 'Gagal memutar suara di browser.';
                    resetState();
                };

                window.speechSynthesis.speak(utterance);
                if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            } catch (e) {
                statusDiv.textContent = 'Gagal total memutar suara.';
                resetState();
            }
        }

        function stopAll() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        stopBtn.addEventListener('click', () => {
            stopAll();
            statusDiv.textContent = 'Pemutaran dihentikan.';
            resetState();
        });

        function resetState() {
            askBtn.disabled = false;
            askBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            badge.textContent = 'AI Studio Connected';
            badge.className = 'text-xs px-3 py-1 bg-gemini-500/20 text-gemini-300 border border-gemini-500/40 rounded-full font-mono shadow-sm';
        }
    </script>
</body>
</html>
